<div class="create-event-wrapper">
  <div class="create-event-card">
    <h1>Créer un événement</h1>

    <form [formGroup]="createEventForm">

      <div class="form-group">
        <label for="image">Image</label>
        <div class="image-upload-area">
            <label for="image" class="image-upload-label">
          </label>
          <input id="image" type="file" accept="image/*"  class="image-input"/>
        </div>
      </div>

      <div class="form-group">
        <label for="categorieId">Catégorie</label>
        <input
          id="categorieId"
          type="number"
          placeholder="ID de la catégorie"
          min="1"
          formControlName="categorieId"
        />
      </div>

      <div class="form-group">
        <label for="name">Nom de l'événement</label>
        <input
          id="name"
          type="text"
          placeholder="Nom de l'événement"
          formControlName="name"
        />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          placeholder="Décrivez votre événement..."
          formControlName="description"
          rows="4"
        ></textarea>
      </div>

      <div class="form-group">
        <label for="place">Lieu</label>
        <input
          id="place"
          type="text"
          placeholder="Adresse ou nom du lieu"
          formControlName="place"
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="dateTimeStart">Date et heure de début</label>
          <input
            id="dateTimeStart"
            type="datetime-local"
            formControlName="dateTimeStart"
          />
        </div>

        <div class="form-group">
          <label for="dateTimeFinish">Date et heure de fin</label>
          <input
            id="dateTimeFinish"
            type="datetime-local"
            formControlName="dateTimeFinish"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="dateLimiteInscription">Date limite d'inscription</label>
        <input
          id="dateLimiteInscription"
          type="datetime-local"
          formControlName="dateLimiteInscription"
        />
      </div>

      <div class="form-group form-group--checkbox">
        <label for="waitList">WaitList</label>
        
          <input
            id="waitList"
            type="checkbox"
            formControlName="waitList"
          />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="minParticipants">Minimum de participants</label>
          <input
            id="minParticipants"
            type="number"
            placeholder="Min"
            min="1"
            formControlName="minParticipants"
          />
        </div>

        <div class="form-group">
          <label for="maxParticipants">Maximum de participants</label>
          <input
            id="maxParticipants"
            type="number"
            placeholder="Max"
            min="1"
            formControlName="maxParticipants"
          />
        </div>
      </div>

    </form>

    @if (formInvalid) {
      <span class="error">Formulaire incorrect, veuillez vérifier vos informations.</span>
    }

    <button (click)="onSubmit()" [disabled]="createEventForm.invalid">
      Créer l'événement
    </button>
  </div>
</div>

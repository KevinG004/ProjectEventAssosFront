<div class="modify-event-wrapper">
  <div class="modify-event-card">
    <h1>Modifier l'événement</h1>

    <form [formGroup]="modifyEventForm">

      <div class="form-group">
        <label for="image">Image de l'événement</label>
        <div class="image-upload-area">
          <label for="image" class="image-upload-label">
            Choisir une nouvelle image
          </label>
          <input id="image" type="file" accept="image/*" class="image-input" />
        </div>
        <span class="hint">Laisser vide pour conserver l'image actuelle.</span>
      </div>


      <div class="form-group">
        <label for="categoryId">Catégorie</label>
        <input
          id="categoryId"
          type="number"
          placeholder="ID de la catégorie"
          min="1"
          formControlName="categoryId"
        />

      </div>

      <div class="form-group">
        <label for="nom">Nom de l'événement</label>
        <input
          id="nom"
          type="text"
          placeholder="Nom de l'événement"
          formControlName="nom"
        />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          placeholder="Décrivez votre événement..."
          formControlName="description"
          rows="4"
        ></textarea>
      </div>

      <div class="form-group">
        <label for="lieu">Lieu <span class="optional">(optionnel)</span></label>
        <input
          id="lieu"
          type="text"
          placeholder="Adresse ou nom du lieu"
          formControlName="lieu"
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="dateHeureDebut">Date et heure de début</label>
          <input
            id="dateHeureDebut"
            type="datetime-local"
            formControlName="dateHeureDebut"
          />
        </div>

        <div class="form-group">
          <label for="dateHeureFin">Date et heure de fin</label>
          <input
            id="dateHeureFin"
            type="datetime-local"
            formControlName="dateHeureFin"
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="minParticipants">Minimum de participants</label>
          <input
            id="minParticipants"
            type="number"
            placeholder="Min"
            min="1"
            formControlName="minParticipants"
          />
        </div>

        <div class="form-group">
          <label for="maxParticipants">Maximum de participants</label>
          <input
            id="maxParticipants"
            type="number"
            placeholder="Max"
            min="1"
            formControlName="maxParticipants"
          />
        </div>
      </div>

    </form>

    @if (formInvalid) {
      <span class="error">Formulaire incorrect, veuillez vérifier vos informations.</span>
    }

    <button (click)="onSubmit()" [disabled]="modifyEventForm.invalid">
      Modifier l'événement
    </button>
  </div>
</div>
